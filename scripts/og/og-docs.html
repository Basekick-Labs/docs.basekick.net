<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; background:#020617;
         font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .stage { position:relative; width:1200px; height:630px; overflow:hidden; background:#0a1120; }

  .topbar { position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg,#22d3ee 0%,#38bdf8 35%,#818cf8 65%,#e879f9 100%); }

  .grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(148,163,184,.06) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(148,163,184,.06) 1px, transparent 1px);
    background-size:32px 32px; }
  .shade-l { position:absolute; inset:0;
    background:linear-gradient(105deg, rgba(2,6,23,.85) 0%, rgba(2,6,23,.25) 55%, transparent 100%); }
  .glow-f { position:absolute; bottom:-300px; right:-220px; width:720px; height:720px; border-radius:50%;
    background:radial-gradient(circle, rgba(217,70,239,.16) 0%, rgba(168,85,247,.08) 45%, transparent 70%);
    filter:blur(50px); }
  .glow-c { position:absolute; top:-320px; right:60px; width:640px; height:640px; border-radius:50%;
    background:radial-gradient(circle, rgba(34,211,238,.10) 0%, rgba(59,130,246,.05) 45%, transparent 70%);
    filter:blur(50px); }

  .content { position:relative; height:100%; padding:56px 72px 48px; display:flex; flex-direction:column; }

  .wordmark { font-size:19px; font-weight:700; color:#f1f5f9; letter-spacing:.34em; margin-bottom:30px; }

  .badge { display:inline-flex; align-self:flex-start; align-items:center; padding:9px 18px; border-radius:10px;
    border:1px solid rgba(34,211,238,.38); background:rgba(8,47,73,.35); margin-bottom:34px; }
  .badge span { font-size:14.5px; font-weight:700; color:#22d3ee; letter-spacing:.18em; }

  h1 { font-size:62px; line-height:1.13; font-weight:800; letter-spacing:-.022em; margin-bottom:22px; }
  .w { color:#f8fafc; }
  .g { background:linear-gradient(90deg,#38bdf8 0%,#67e8f9 30%,#818cf8 68%,#e879f9 100%);
       -webkit-background-clip:text; background-clip:text; color:transparent; }

  .sub { font-size:25px; line-height:1.45; color:#8b9bb4; font-weight:400; margin-bottom:26px; max-width:820px; }

  .rule { width:88px; height:4px; border-radius:2px; margin-bottom:34px;
    background:linear-gradient(90deg,#22d3ee 0%,#a855f7 100%); }

  .feats { display:flex; align-items:center; gap:44px; margin-bottom:34px; }
  .feat { display:flex; align-items:center; gap:11px; font-size:19.5px; color:#e2e8f0; font-weight:400; }
  .fdot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .c1 { background:#22d3ee; } .c2 { background:#60a5fa; } .c3 { background:#818cf8; }

  .spacer { flex:1; }

  .bottom { display:flex; align-items:center; gap:26px; }
  .term { display:flex; align-items:center; gap:16px; flex:1; padding:19px 22px; border-radius:14px;
    border:1px solid #263248; background:rgba(10,17,31,.85); }
  .tdots { display:flex; gap:6px; flex-shrink:0; }
  .tdots i { width:9px; height:9px; border-radius:50%; background:#475569; display:block; }
  .term code { font-family:'JetBrains Mono',monospace; font-size:19px; color:#cbd5e1; }
  .term .p { color:#22d3ee; }
  .site { font-family:'JetBrains Mono',monospace; font-size:17px; color:#64748b; flex-shrink:0; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="glow-c"></div>
  <div class="glow-f"></div>
  <div class="shade-l"></div>
  <div class="topbar"></div>

  <div class="content">
    <div class="wordmark">BASEKICK LABS</div>
    <div class="badge"><span>DOCUMENTATION</span></div>

    <h1><span class="w">Everything you need to</span><br><span class="g">run Arc in production.</span></h1>

    <div class="sub">Install guides, configuration reference and operational detail for Arc,
      the open, SQL-native time-series database.</div>

    <div class="rule"></div>

    <div class="feats">
      <div class="feat"><span class="fdot c1"></span>Arc OSS</div>
      <div class="feat"><span class="fdot c2"></span>Arc Enterprise</div>
      <div class="feat"><span class="fdot c3"></span>Arc Launchpad</div>
    </div>

    <div class="spacer"></div>

    <div class="bottom">
      <div class="term">
        <div class="tdots"><i></i><i></i><i></i></div>
        <code><span class="p">$</span> docker run -p 8000:8000 ghcr.io/basekick-labs/arc</code>
      </div>
      <div class="site">docs.basekick.net</div>
    </div>
  </div>
</div>
</body>
</html>
