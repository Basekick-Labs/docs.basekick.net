# Traefik terminates TLS and proxies here over plain HTTP, so $scheme is always
# "http". Redirects must use the scheme the *client* used, or every redirect
# costs an extra hop through Traefik's HTTP->HTTPS rule.
map $http_x_forwarded_proto $client_scheme {
    default $scheme;
    ""      $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name docs.basekick.net;
    # /srv is the deploy directory; /srv/html is a symlink to the current
    # release. Serving through the symlink is what makes deploys atomic.
    root /srv/html;
    index index.html;

    # nginx resolves /srv/html per request, so swapping the symlink publishes a
    # new release with no reload. This depends on open_file_cache staying off
    # (its default): enabling it would serve the previous release for the cache
    # duration after every deploy.

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # ---------------------------------------------------------------------
    # 1. Exact matches (highest precedence)
    # ---------------------------------------------------------------------

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /404.html {
        internal;
    }

    # The static search index. Next writes it with no file extension, so
    # without this it is served as application/octet-stream and - because
    # gzip_types matches on the resolved type - uncompressed. That is the
    # difference between a 10MB and a 1.6MB download for anyone who opens
    # search.
    location = /api/search {
        default_type application/json;
        gzip_types application/json;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # 2. ^~ prefix matches (beat regex locations)
    #
    # These files are deployed into the document root alongside the site, so
    # without an explicit block they are served as plain downloads. They leak
    # server paths, container names and the Traefik topology.
    # ---------------------------------------------------------------------

    location ^~ /nginx.conf {
        return 404;
    }

    location ^~ /docker-compose.yml {
        return 404;
    }

    location ^~ /_redirects {
        return 404;
    }

    # ---------------------------------------------------------------------
    # 3. Regex matches (evaluated in file order, first match wins)
    # ---------------------------------------------------------------------

    # Dotfiles: .git, .DS_Store, .last-deploy, .env, ...
    location ~ /\. {
        deny all;
    }

    # Hashed build assets are safe to cache forever.
    # `expires` emits its own Cache-Control, so setting both here would send
    # two conflicting Cache-Control headers. Use add_header alone.
    #
    # These regex blocks take precedence over any prefix location, so /assets/
    # and /img/ need no blocks of their own - every file under them matches an
    # extension here. Explicit /assets/ and /img/ blocks used to exist and were
    # dead code.
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # 4. Catch-all
    #
    # Ends in =404 so unknown URLs return a real 404. The previous config fell
    # back to /index.html (and /arc/index.html for product paths), which meant
    # every unknown URL returned HTTP 200 with a real page - a soft 404. Those
    # get crawled, indexed, then dropped, and they burn crawl budget.
    #
    # Trailing slash is canonical. Every page is emitted as <path>/index.html,
    # so without the redirect below, `try_files $uri` matches the directory,
    # `index` serves its index.html, and /arc and /arc/ both return 200 with
    # byte-identical content - the whole site duplicated across two URL forms.
    # Dropping $uri.html from try_files does NOT prevent this on its own; the
    # directory match does it. -d plus a 301 is what actually fixes it.
    #
    # One catch-all replaces the four per-product regex blocks that used to
    # live here. They were behaviourally identical, and having ^/arc($|/)
    # ordered above ^/arc-enterprise($|/) was a footgun: dropping the ($|/)
    # anchor would silently serve Arc OSS content on every Enterprise URL.
    # ---------------------------------------------------------------------

    location / {
        # `always` so the header survives on error responses too. Note that an
        # add_header anywhere in this block discards headers inherited from the
        # server level - add any future site-wide header here as well.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        # Canonicalise to the trailing-slash form before serving. The $uri
        # guard matters: -d matches a directory whether or not the URI already
        # ends in a slash, so testing -d alone sends /arc/ to /arc// and then
        # to a 404.
        if ($uri !~ /$) {
            set $maybe_dir "1";
        }
        if (-d $request_filename) {
            set $maybe_dir "${maybe_dir}1";
        }
        if ($maybe_dir = "11") {
            return 301 $client_scheme://$host$uri/;
        }

        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
